<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    :root { --ink: #22303F; --muted: #5E6875; --paper: #F6EFE0; --page: #FFFCF4; --navy: #233E55; --gold: #C4A66A; --line: #DCCFB4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    header { background: var(--navy); border-bottom: 3px solid var(--gold); }
    header a { display: block; max-width: 820px; margin: 0 auto; padding: 18px 20px; color: #F6EFE0; font-size: 20px; font-weight: 700; text-decoration: none; letter-spacing: .02em; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 20px 40px; background: var(--page); min-height: 60vh; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 16px; }
    h2 { font-size: 21px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1.5px solid var(--gold); }
    h3 { font-size: 17px; margin: 22px 0 8px; }
    a { color: var(--navy); }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #EFE6D2; }
    code { background: #EFE6D2; padding: 1px 5px; border-radius: 3px; font-size: 14px; }
    footer { max-width: 820px; margin: 0 auto; padding: 18px 20px 32px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>
{{ content }}
  </main>
  <footer>
    문의 / Contact: <a href="mailto:contact@rubypearllab.com">contact@rubypearllab.com</a><br>
    &copy; {{ 'now' | date: '%Y' }} RubyPearl Lab
  </footer>
</body>
</html>
